<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" sizes="any" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split — Share expenses with friends</title>
    <meta
      name="description"
      content="Free open-source app for splitting shared expenses. No sign-up: share a split by its link, add expenses together and settle up with as few transfers as possible. End-to-end encrypted."
    />
    <link rel="canonical" href="https://split.mayfleet.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Split" />
    <meta property="og:url" content="https://split.mayfleet.com/" />
    <meta property="og:title" content="Split — Share expenses with friends" />
    <meta
      property="og:description"
      content="No sign-up, end-to-end encrypted, open source. Share a split by its link and settle up with as few transfers as possible."
    />
    <meta property="og:image" content="https://split.mayfleet.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Split — Share expenses with friends" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      const darkSaved = localStorage.getItem('split:dark')
      const dark = darkSaved
        ? darkSaved === 'true'
        : window.matchMedia?.('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-dark', dark)
    </script>
    <style>
      html {
        background: #f5f5f5;
      }
      html[data-dark='true'] {
        background: #242424;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
